name: Build release bundles

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deck:
    name: Steam Deck bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev shellcheck
      - name: Validate Deck shell scripts
        run: shellcheck packaging/deck/install.sh packaging/deck/uninstall.sh
      - name: Validate installer shortcut
        run: |
          if ! output=$(desktop-file-validate "packaging/deck/Install Steam Deck File Transfer.desktop" 2>&1); then
            echo "::error::$output"
            exit 1
          fi
      - name: Validate uninstaller shortcut
        run: desktop-file-validate "packaging/deck/Uninstall Steam Deck File Transfer.desktop"
      - name: Validate installed app shortcut
        run: |
          sed 's|@EXEC@|"/home/deck/Applications/SteamDeckFileTransfer/sdft-deck"|' packaging/deck/io.github.kyabetsu4.SteamDeckFileTransfer.desktop.in > /tmp/io.github.kyabetsu4.SteamDeckFileTransfer.desktop
          desktop-file-validate /tmp/io.github.kyabetsu4.SteamDeckFileTransfer.desktop
      - name: Test
        run: cargo test --workspace
      - name: Build Deck receiver
        run: cargo build --release --bin sdft-deck
      - name: Assemble click-to-install bundle
        run: |
          mkdir -p dist/SteamDeckFileTransfer
          cp target/release/sdft-deck dist/SteamDeckFileTransfer/
          cp packaging/deck/* dist/SteamDeckFileTransfer/
          chmod 0755 dist/SteamDeckFileTransfer/sdft-deck
          chmod 0755 dist/SteamDeckFileTransfer/install.sh
          chmod 0755 dist/SteamDeckFileTransfer/uninstall.sh
          chmod 0755 "dist/SteamDeckFileTransfer/Install Steam Deck File Transfer.desktop"
          chmod 0755 "dist/SteamDeckFileTransfer/Uninstall Steam Deck File Transfer.desktop"
          tar -C dist -czf dist/SteamDeckFileTransfer-Deck-x86_64.tar.gz SteamDeckFileTransfer
      - uses: actions/upload-artifact@v4
        with:
          name: SteamDeckFileTransfer-Deck-x86_64
          path: dist/SteamDeckFileTransfer-Deck-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows PC bundle
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build PC sender
        run: cargo build --release --bin sdft-pc
      - name: Assemble portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SteamDeckFileTransfer-PC | Out-Null
          Copy-Item target/release/sdft-pc.exe dist/SteamDeckFileTransfer-PC/
          Copy-Item README.md dist/SteamDeckFileTransfer-PC/
          Compress-Archive -Path dist/SteamDeckFileTransfer-PC -DestinationPath dist/SteamDeckFileTransfer-PC-Windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SteamDeckFileTransfer-PC-Windows-x86_64
          path: dist/SteamDeckFileTransfer-PC-Windows-x86_64.zip
          if-no-files-found: error

  github-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deck, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
